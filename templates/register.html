{% extends "base.html" %}

{% block title %}Inscription - Plateforme Entrepreneuriale{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-3 fw-bold">Inscription</h2>
                        <p class="text-muted">Créez votre compte et découvrez les opportunités adaptées à votre profil</p>
                    </div>

                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label fw-bold">
                                    <i class="fas fa-user me-1 text-primary"></i> Nom d'utilisateur
                                </label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Ex: Amine_DZ" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label fw-bold">
                                    <i class="fas fa-envelope me-1 text-primary"></i> Email
                                </label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="nom@exemple.dz" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-bold">
                                <i class="fas fa-lock me-1 text-primary"></i> Mot de passe
                            </label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>

                        <div class="row">
                            <!-- Niveau d'études -->
                            <div class="col-md-6 mb-3">
                                <label for="niveau_etudes" class="form-label fw-bold">
                                    <i class="fas fa-graduation-cap me-1 text-primary"></i> Niveau d'études
                                </label>
                                <select class="form-select" id="niveau_etudes" name="niveau_etudes" required>
                                    <option value="">-- Choisir --</option>
                                    <option value="Formation Professionnelle / TS">Formation Pro / TS</option>
                                    <option value="Licence / Bac+3">Licence (Bac+3)</option>
                                    <option value="Master / Ingénieur / Bac+5">Master / Ingénieur (Bac+5)</option>
                                    <option value="Doctorat">Doctorat</option>
                                    <option value="Autodidacte / Praticien">Autodidacte / Praticien</option>
                                </select>
                            </div>

                            <!-- Domaine du Diplôme / Compétence -->
                            <div class="col-md-6 mb-3">
                                <label for="domaine_diplome" class="form-label fw-bold">
                                    <i class="fas fa-book me-1 text-primary"></i> Domaine / Spécialité
                                </label>
                                <input type="text" class="form-control" id="domaine_diplome" name="domaine_diplome" 
                                       placeholder="Ex: Agronomie, Informatique, BTP, Finance..." required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="wilaya" class="form-label fw-bold">
                                <i class="fas fa-map-marker-alt me-1 text-primary"></i> Wilaya de résidence
                            </label>
                            <select class="form-select" id="wilaya" name="wilaya" required>
                                <option value="">-- Choisir votre wilaya --</option>
                                {% for code, data in wilayas.items() %}
                                <option value="{{ data.nom }}">{{ code }} - {{ data.nom }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
                            <i class="fas fa-user-plus me-1"></i> Créer Mon Compte & Obtenir mes Conseils
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="mb-1 text-muted">Déjà un compte ?</p>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-sign-in-alt me-1"></i> Se connecter
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
